<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 600px;
    height: 600px;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif;
    background: #000;
    display: flex;
    align-items: flex-start;
    justify-content: flex-start;
  }

  .card {
    width: 600px;
    height: 600px;
    position: relative;
    overflow: hidden;
  }

  /* Real whale photo background */
  .bg-photo {
    position: absolute;
    inset: 0;
    background-image: url('https://images.unsplash.com/photo-1568430462989-44163eb1752f?w=900&q=80');
    background-size: cover;
    background-position: center 20%;
    filter: brightness(0.3) saturate(1.1) hue-rotate(10deg);
  }

  /* Dark gradient overlay */
  .overlay {
    position: absolute;
    inset: 0;
    background:
      linear-gradient(180deg,
        rgba(0,0,0,0.2) 0%,
        rgba(0,0,0,0.1) 30%,
        rgba(0,0,0,0.7) 65%,
        rgba(0,0,0,0.97) 100%
      );
  }

  /* Green tint overlay */
  .green-tint {
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at 50% 100%, rgba(0,255,136,0.12) 0%, transparent 70%);
  }

  /* Scan lines for drama */
  .scanlines {
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      rgba(0,0,0,0.03) 2px,
      rgba(0,0,0,0.03) 4px
    );
  }

  .content {
    position: relative;
    z-index: 10;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 28px;
  }

  /* Top bar */
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .brand-icon {
    font-size: 20px;
  }

  .brand-name {
    font-size: 16px;
    font-weight: 800;
    color: #fff;
    letter-spacing: -0.5px;
  }

  .brand-name em {
    color: #00ff88;
    font-style: normal;
  }

  .alert-pill {
    display: flex;
    align-items: center;
    gap: 6px;
    background: rgba(255, 59, 59, 0.2);
    border: 1px solid rgba(255, 59, 59, 0.5);
    border-radius: 100px;
    padding: 5px 14px;
    font-size: 10px;
    font-weight: 800;
    color: #ff4545;
    letter-spacing: 1.5px;
    text-transform: uppercase;
  }

  .dot {
    width: 6px; height: 6px;
    background: #ff4545;
    border-radius: 50%;
    box-shadow: 0 0 6px #ff4545;
  }

  /* Middle area - spacer where whale shows through */
  .spacer { flex: 1; }

  /* Bottom content */
  .bottom {
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  /* Win tag */
  .win-tag {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: rgba(0, 255, 136, 0.15);
    border: 1px solid rgba(0, 255, 136, 0.4);
    border-radius: 8px;
    padding: 6px 14px;
    width: fit-content;
    font-size: 11px;
    font-weight: 800;
    color: #00ff88;
    letter-spacing: 1px;
    text-transform: uppercase;
  }

  /* Big amount */
  .big-amount {
    font-size: 72px;
    font-weight: 900;
    color: #00ff88;
    letter-spacing: -4px;
    line-height: 1;
    text-shadow: 0 0 40px rgba(0,255,136,0.4), 0 0 80px rgba(0,255,136,0.2);
  }

  .big-amount sup {
    font-size: 32px;
    letter-spacing: -1px;
    vertical-align: super;
    font-weight: 800;
  }

  .market-label {
    font-size: 18px;
    font-weight: 600;
    color: rgba(255,255,255,0.85);
    line-height: 1.3;
    max-width: 480px;
  }

  /* Stats row */
  .stats {
    display: flex;
    align-items: center;
    gap: 0;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 14px;
    overflow: hidden;
  }

  .stat {
    flex: 1;
    padding: 14px 16px;
    text-align: center;
    border-right: 1px solid rgba(255,255,255,0.08);
  }

  .stat:last-child { border-right: none; }

  .stat-val {
    font-size: 20px;
    font-weight: 800;
    color: #fff;
  }

  .stat-val.green { color: #00ff88; }
  .stat-val.blue { color: #58a6ff; }

  .stat-lbl {
    font-size: 9px;
    color: rgba(255,255,255,0.4);
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-top: 3px;
  }

  /* Footer */
  .footer-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .wallet-info {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .wallet-addr {
    font-size: 12px;
    color: rgba(255,255,255,0.5);
    font-family: 'SF Mono', 'Fira Code', monospace;
  }

  .wallet-profit {
    font-size: 13px;
    font-weight: 700;
    color: #00ff88;
  }

  .cta {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 2px;
  }

  .cta-label {
    font-size: 10px;
    color: rgba(255,255,255,0.4);
    text-transform: uppercase;
    letter-spacing: 0.8px;
  }

  .cta-url {
    font-size: 16px;
    font-weight: 800;
    color: #00ff88;
    letter-spacing: -0.5px;
    text-shadow: 0 0 20px rgba(0,255,136,0.5);
  }
</style>
</head>
<body>
<div class="card">
  <div class="bg-photo"></div>
  <div class="overlay"></div>
  <div class="green-tint"></div>
  <div class="scanlines"></div>

  <div class="content">
    <!-- Top bar -->
    <div class="topbar">
      <div class="brand">
        <div class="brand-icon">🐋</div>
        <div class="brand-name">Whale<em>Track</em></div>
      </div>
      <div class="alert-pill">
        <div class="dot"></div>
        Live Alert
      </div>
    </div>

    <div class="spacer"></div>

    <div class="bottom">
      <div class="win-tag">🏆 &nbsp;Whale Win — Resolved</div>

      <div class="big-amount"><sup>$</sup>178K</div>

      <div class="market-label">
        "Will Bitcoin dip below $60K?" — bet NO, cashed out big
      </div>

      <!-- Stats -->
      <div class="stats">
        <div class="stat">
          <div class="stat-val green">+128%</div>
          <div class="stat-lbl">Return</div>
        </div>
        <div class="stat">
          <div class="stat-val blue">NO</div>
          <div class="stat-lbl">Position</div>
        </div>
        <div class="stat">
          <div class="stat-val">78¢</div>
          <div class="stat-lbl">Entry</div>
        </div>
        <div class="stat">
          <div class="stat-val green">+$83K</div>
          <div class="stat-lbl">All-time P&L</div>
        </div>
      </div>

      <!-- Footer -->
      <div class="footer-row">
        <div class="wallet-info">
          <div class="wallet-addr">JnStTrdrBnusFnd</div>
          <div class="wallet-profit">↑ Copy this whale on Polymarket</div>
        </div>
        <div class="cta">
          <div class="cta-label">Track free at</div>
          <div class="cta-url">whaletrack.app</div>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
