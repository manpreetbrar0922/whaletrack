<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"/>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1500px; height: 500px; overflow: hidden; }

  .banner {
    width: 1500px;
    height: 500px;
    background: linear-gradient(135deg, #020d1a 0%, #0a1628 30%, #061a0f 70%, #020d0a 100%);
    position: relative;
    overflow: hidden;
    display: flex;
    align-items: flex-start;
    padding: 40px 100px 0 160px;
  }

  /* Grid lines */
  .grid {
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(88,166,255,0.06) 1px, transparent 1px),
      linear-gradient(90deg, rgba(88,166,255,0.06) 1px, transparent 1px);
    background-size: 60px 60px;
  }

  /* Glow blobs */
  .glow-blue {
    position: absolute;
    width: 500px; height: 500px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(88,166,255,0.15) 0%, transparent 70%);
    top: -100px; left: -100px;
  }
  .glow-green {
    position: absolute;
    width: 400px; height: 400px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(63,185,80,0.12) 0%, transparent 70%);
    bottom: -100px; right: 200px;
  }

  /* Animated dots */
  .dot {
    position: absolute;
    border-radius: 50%;
    background: rgba(88,166,255,0.4);
  }
  .dot1 { width: 4px; height: 4px; top: 80px; left: 300px; }
  .dot2 { width: 3px; height: 3px; top: 200px; left: 800px; background: rgba(63,185,80,0.5); }
  .dot3 { width: 5px; height: 5px; top: 350px; left: 500px; }
  .dot4 { width: 3px; height: 3px; top: 120px; left: 1100px; background: rgba(63,185,80,0.4); }
  .dot5 { width: 4px; height: 4px; top: 400px; left: 1200px; }

  /* Alert card (right side) */
  .alert-card {
    position: absolute;
    right: 80px;
    top: 50%;
    transform: translateY(-50%);
    background: rgba(22, 27, 34, 0.9);
    border: 1px solid rgba(88,166,255,0.25);
    border-radius: 20px;
    padding: 26px 30px;
    width: 390px;
    backdrop-filter: blur(10px);
    box-shadow: 0 0 40px rgba(88,166,255,0.1), 0 20px 60px rgba(0,0,0,0.5);
  }
  .alert-header {
    font-size: 13px;
    font-weight: 800;
    color: #3fb950;
    letter-spacing: 2px;
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .alert-dot {
    width: 9px; height: 9px;
    border-radius: 50%;
    background: #3fb950;
    box-shadow: 0 0 10px #3fb950;
  }
  .alert-amount {
    font-size: 42px;
    font-weight: 900;
    color: #e6edf3;
    margin-bottom: 8px;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  .alert-amount span { color: #58a6ff; }
  .alert-market {
    font-size: 18px;
    color: #8b949e;
    margin-bottom: 18px;
    line-height: 1.45;
  }
  .alert-bar {
    height: 7px;
    border-radius: 4px;
    background: rgba(255,255,255,0.08);
    overflow: hidden;
    margin-bottom: 12px;
  }
  .alert-bar-fill {
    height: 100%;
    width: 74%;
    background: linear-gradient(90deg, #3fb950, #58a6ff);
    border-radius: 4px;
  }
  .alert-footer {
    display: flex;
    justify-content: space-between;
    font-size: 17px;
    color: #8b949e;
  }
  .alert-footer span:first-child { color: #3fb950; font-weight: 700; }

  /* Left content */
  .content {
    position: relative;
    z-index: 2;
    max-width: 700px;
  }
  .tag {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: rgba(63,185,80,0.1);
    border: 1px solid rgba(63,185,80,0.3);
    border-radius: 20px;
    padding: 7px 18px;
    font-size: 16px;
    font-weight: 700;
    color: #3fb950;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    margin-bottom: 12px;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  .tag-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: #3fb950;
    box-shadow: 0 0 8px #3fb950;
  }
  .title {
    font-size: 96px;
    font-weight: 900;
    line-height: 1.0;
    margin-bottom: 10px;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    letter-spacing: -3px;
  }
  .title .whale { color: #58a6ff; }
  .title .track { color: #e6edf3; }
  .subtitle {
    font-size: 28px;
    color: #8b949e;
    margin-bottom: 18px;
    line-height: 1.45;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  .subtitle strong { color: #e6edf3; }
  .url {
    font-size: 22px;
    font-weight: 700;
    color: #58a6ff;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    opacity: 0.9;
    letter-spacing: 0.5px;
    margin-bottom: 14px;
  }
</style>
</head>
<body>
<div class="banner">
  <div class="grid"></div>
  <div class="glow-blue"></div>
  <div class="glow-green"></div>
  <div class="dot dot1"></div>
  <div class="dot dot2"></div>
  <div class="dot dot3"></div>
  <div class="dot dot4"></div>
  <div class="dot dot5"></div>

  <!-- LEFT: Main copy -->
  <div class="content">
    <div class="tag"><span class="tag-dot"></span>Real-time Whale Intelligence</div>
    <div class="title">
      <span class="whale">Whale</span><span class="track">Track</span>
    </div>
    <div class="url">🌐 whaletrack.app</div>
    <div class="subtitle">
      Follow <strong>smart money</strong> on Polymarket.<br>
      Real-time alerts · Copy bets · Win with the whales.
    </div>
  </div>

  <!-- RIGHT: Fake alert card -->
  <div class="alert-card">
    <div class="alert-header"><span class="alert-dot"></span>WHALE ALERT</div>
    <div class="alert-amount">🐋 <span>$47K</span> bet</div>
    <div class="alert-market">Will Bitcoin reach $100K<br>by December 2026?</div>
    <div class="alert-bar"><div class="alert-bar-fill"></div></div>
    <div class="alert-footer">
      <span>YES · 74%</span>
      <span>Copy Bet →</span>
    </div>
  </div>
</div>
</body>
</html>
