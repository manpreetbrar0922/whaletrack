<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="630" fill="#0d1117"/>

  <!-- Top accent bar -->
  <rect width="1200" height="4" fill="#58a6ff"/>

  <!-- Grid pattern -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#161b22" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#grid)" opacity="0.5"/>

  <!-- Glow blob behind logo -->
  <ellipse cx="600" cy="280" rx="300" ry="180" fill="#58a6ff" opacity="0.04"/>

  <!-- Whale emoji -->
  <text x="600" y="210" font-size="80" text-anchor="middle" font-family="Arial, sans-serif">🐋</text>

  <!-- WhaleTrack title -->
  <text x="600" y="310" font-family="Arial Black, Arial, sans-serif" font-size="72" font-weight="900" fill="#e6edf3" text-anchor="middle" letter-spacing="-1">WhaleTrack</text>

  <!-- Tagline -->
  <text x="600" y="370" font-family="Arial, sans-serif" font-size="28" fill="#8b949e" text-anchor="middle">Track what the biggest Polymarket traders are betting on</text>

  <!-- Divider -->
  <line x1="460" y1="400" x2="740" y2="400" stroke="#30363d" stroke-width="1"/>

  <!-- Stats row -->
  <g>
    <!-- Stat 1 -->
    <text x="350" y="445" font-family="Arial Black, Arial, sans-serif" font-size="32" font-weight="900" fill="#58a6ff" text-anchor="middle">150+</text>
    <text x="350" y="475" font-family="Arial, sans-serif" font-size="18" fill="#8b949e" text-anchor="middle">Active Users</text>

    <!-- Divider -->
    <line x1="500" y1="430" x2="500" y2="480" stroke="#30363d" stroke-width="1"/>

    <!-- Stat 2 -->
    <text x="600" y="445" font-family="Arial Black, Arial, sans-serif" font-size="32" font-weight="900" fill="#3fb950" text-anchor="middle">Real-Time</text>
    <text x="600" y="475" font-family="Arial, sans-serif" font-size="18" fill="#8b949e" text-anchor="middle">Whale Activity</text>

    <!-- Divider -->
    <line x1="700" y1="430" x2="700" y2="480" stroke="#30363d" stroke-width="1"/>

    <!-- Stat 3 -->
    <text x="850" y="445" font-family="Arial Black, Arial, sans-serif" font-size="32" font-weight="900" fill="#d29922" text-anchor="middle">Free</text>
    <text x="850" y="475" font-family="Arial, sans-serif" font-size="18" fill="#8b949e" text-anchor="middle">No Signup</text>
  </g>

  <!-- URL badge -->
  <rect x="450" y="530" width="300" height="46" rx="23" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="600" y="559" font-family="Arial, sans-serif" font-size="20" fill="#58a6ff" text-anchor="middle">whaletrack.app</text>
</svg>
